# 빌드·테스트 → 릴리스면 win-x64 단일 exe(런타임 포함) zip + latest.json 을 Release 에 첨부
#  릴리스 만드는 두 가지 방법 (결과는 같음)
#   1. v* 태그 푸시
#   2. Actions 탭 → build → Run workflow → version 입력 (태그를 워크플로가 만든다)
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: '릴리스 버전 (예: 0.1.0). 비우면 빌드·테스트만'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: ver
        run: |
          BASE=$(grep -oP '<Version>\K[^<]+' src/Gateway.Server/Gateway.Server.csproj)
          INPUT="${{ github.event.inputs.version }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"; RELEASE=true
          elif [[ -n "$INPUT" ]]; then
            VER="${INPUT#v}"; RELEASE=true
            [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version 형식: X.Y.Z"; exit 1; }
            git ls-remote --exit-code --tags origin "v$VER" >/dev/null && { echo "태그 v$VER 이 이미 있음"; exit 1; }
          else
            VER="${BASE}-${GITHUB_SHA::7}"; RELEASE=false
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "version: $VER release: $RELEASE (csproj $BASE)"
          if [[ "$RELEASE" == true && "$VER" != "$BASE" ]]; then
            echo "::warning::csproj Version($BASE) 과 릴리스 버전($VER) 이 다릅니다. 실행 파일은 $VER 로 빌드됩니다."
          fi

      - name: Build & test
        run: |
          dotnet build -c Release
          dotnet test -c Release --no-build --logger "console;verbosity=minimal"

      - name: Publish win-x64 (self-contained single file)
        run: |
          dotnet publish src/Gateway.Server -c Release -r win-x64 -p:Version=${{ steps.ver.outputs.ver }} -o dist/AgvFotaGateway
          cp deploy/*.bat docs/DEPLOY.md dist/AgvFotaGateway/
          rm -f dist/AgvFotaGateway/*.pdb dist/AgvFotaGateway/appsettings.Development.json dist/AgvFotaGateway/web.config
          cd dist && zip -r "AgvFotaGateway_${{ steps.ver.outputs.ver }}_win-x64.zip" AgvFotaGateway
          # 사내 피드(Update.Source=Url)용 latest.json — 릴리스 자산을 사내 HTTP 폴더에 복사하면 그대로 쓸 수 있다
          SIZE=$(stat -c %s "AgvFotaGateway_${{ steps.ver.outputs.ver }}_win-x64.zip")
          cat > latest.json <<JSON
          {
            "version": "${{ steps.ver.outputs.ver }}",
            "url": "https://github.com/${{ github.repository }}/releases/download/v${{ steps.ver.outputs.ver }}/AgvFotaGateway_${{ steps.ver.outputs.ver }}_win-x64.zip",
            "notes": "AgvFotaGateway ${{ steps.ver.outputs.ver }}",
            "size": $SIZE
          }
          JSON
          ls -l
          {
            echo "### AgvFotaGateway ${{ steps.ver.outputs.ver }}"
            echo '```'; ls -l AgvFotaGateway; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: AgvFotaGateway_${{ steps.ver.outputs.ver }}_win-x64
          path: dist/AgvFotaGateway/

      - name: Tag (manual release)
        if: steps.ver.outputs.release == 'true' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.ver.outputs.ver }}" -m "AgvFotaGateway ${{ steps.ver.outputs.ver }}"
          git push origin "v${{ steps.ver.outputs.ver }}"

      - name: Release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.ver }}
          files: |
            dist/AgvFotaGateway_${{ steps.ver.outputs.ver }}_win-x64.zip
            dist/latest.json
          generate_release_notes: true
